<!-- ====== 登录页 ====== -->
<div id="loginOverlay">
  <div class="login-bg"><div class="login-bg-grid"></div></div>
  <div class="landing-container">
    <div class="landing-hero">
      <div class="landing-brand">
        <h1 class="landing-title">论文搭子<br><span>ThesisBuddy</span></h1>
        <p class="landing-desc">从一个想法到答辩通关，你的AI论文搭子，陪你搞定论文全流程</p>
      </div>
      <div class="landing-workflow">
        <h2>论文全流程工作台 — 七个阶段</h2>
        <div class="landing-stage-rail">
          <span class="landing-stage">🎯 想清楚</span><span class="landing-stage">📚 找资料</span>
          <span class="landing-stage">🧭 搭结构</span><span class="landing-stage">✍️ 写出来</span>
          <span class="landing-stage">🔍 改得好</span><span class="landing-stage">📊 过评审</span>
          <span class="landing-stage">🎤 做答辩</span>
        </div>
      </div>
    </div>
    <div class="landing-login">
      <div class="login-card">
        <h3 id="loginCardTitle">登录系统</h3>
        <div class="login-form">
          <input type="text" id="loginUsername" placeholder="用户名" autocomplete="username" autofocus>
          <input type="password" id="loginPassword" placeholder="密码" autocomplete="current-password">
          <input type="password" id="regConfirmPassword" placeholder="确认密码" style="display:none">
          <div class="login-error" id="loginError"></div>
          <button class="login-btn" id="loginBtn" onclick="doLogin()">
            <span id="loginBtnText">登 录</span>
          </button>
        </div>
        <div class="login-switch">
          <span id="loginSwitchText">还没有账号？</span>
          <a href="javascript:void(0)" id="loginSwitchLink" onclick="toggleRegMode()">立即注册</a>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
document.getElementById('loginUsername')&&document.getElementById('loginUsername').addEventListener('keydown',function(e){if(e.key==='Enter'){var p=document.getElementById('loginPassword');if(p)p.focus()}});
document.getElementById('loginPassword')&&document.getElementById('loginPassword').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});
</script>

<!-- ====== 应用壳层 ====== -->
<div id="appShell" style="display:none">
  <!-- 顶栏 -->
  <div class="bar">
    <div class="bar-left">
      <h1>论文搭子 <span>ThesisBuddy</span></h1>
      <span id="projectTitleChip" class="project-chip" onclick="typeof openIdeaWizard==='function'&&openIdeaWizard()" title="项目">未创建项目</span>
    </div>
    <div class="bar-center" id="barTabs">
      <button class="bar-tab active" data-nav="workspace">总览</button>
      <button class="bar-tab" data-nav="literature">📚 文献</button>
      <button class="bar-tab" data-nav="writing">✍️ 写作</button>
      <button class="bar-tab" data-nav="review">🔍 审阅</button>
      <button class="bar-tab" data-nav="dashboard">📊 看板</button>
      <button class="bar-tab" data-nav="defense">🎤 答辩</button>
    </div>
    <div class="bar-right">
      <span id="statusBar" style="font-size:11px;opacity:.5">就绪</span>
      <span id="balanceBar" onclick="TB.events.emit('recharge:open')" style="cursor:pointer;background:rgba(255,255,255,.06);padding:3px 10px;border-radius:10px;font-size:12px">✨ <b id="balanceAmount">0</b> 点</span>
      <button id="notifyBellBtn" onclick="TB.events.emit('notifications:toggle')" class="bar-btn">🔔<span id="notifyBadge" style="display:none;position:absolute;top:-3px;right:-2px;min-width:14px;height:14px;padding:0 3px;border-radius:8px;background:#ef4444;color:#fff;font-size:10px;line-height:14px;font-weight:700">0</span></button>
      <button onclick="TB.events.emit('account:open')" class="bar-btn">账户</button>
      <button onclick="window.location.href='/admin.html'" class="bar-btn" id="adminPanelBtn" style="display:none">⚙️</button>
      <button onclick="typeof doLogout==='function'&&doLogout()" class="bar-btn">登出</button>
    </div>
  </div>

  <!-- 两栏主布局 -->
  <div class="main">
    <!-- 左侧导航轨 -->
    <div class="nav-sidebar" id="navSidebar">
      <div class="nav-brand">论文阶段</div>
      <div id="stageNav"></div>
      <div class="nav-divider"></div>
      <div class="nav-section">快捷入口</div>
      <button class="nav-item" onclick="typeof openIdeaWizard==='function'&&openIdeaWizard()"><span class="icon">💡</span>从想法开始</button>
      <button class="nav-item" onclick="typeof openImportDialog==='function'?openImportDialog('new'):typeof PaperImport!=='undefined'?PaperImport.open('new'):null"><span class="icon">📎</span>导入论文</button>
      <button class="nav-item" onclick="typeof openMaterialsLibrary==='function'&&openMaterialsLibrary()"><span class="icon">📁</span>资料库</button>
      <div id="toolboxFavorites" class="toolbox-favs"></div>
    </div>

    <!-- 主内容区 — 唯一挂载点 -->
    <div class="main-content" id="mainContent">
      <div id="workspaceContent"></div>
    </div>
  </div>
</div>

<!-- 动态弹窗容器 -->
<div id="modalRoot"></div>
<div class="toast-container" id="toastRoot"></div>

<!-- 加载覆盖层 -->
<div id="loadOv" class="loading-overlay hidden">
  <div class="loading-spinner"></div>
  <div class="loading-msg" id="loadMsg"></div>
  <div class="loading-pct" id="loadPct" style="display:none">0%</div>
  <div class="loading-bar"><div class="loading-bar-fill" id="loadBar" style="width:0%"></div></div>
  <div class="loading-msg" id="loadDetail" style="font-size:12px;opacity:.5;margin-top:8px"></div>
</div>

<div id="notifyPanel" style="display:none;position:fixed;top:52px;right:12px;width:360px;max-height:70vh;overflow:hidden;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 16px 48px rgba(0,0,0,.22);z-index:100060">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border)">
    <b style="font-size:14px">消息中心</b>
    <button onclick="typeof markAllNotificationsRead==='function'&&markAllNotificationsRead()" style="color:var(--accent);font-size:11px;font-weight:600;border:none;background:none;cursor:pointer">全部已读</button>
  </div>
  <div id="notifyList" style="max-height:56vh;overflow-y:auto;padding:6px 0"></div>
</div>

<!-- ====== 保持兼容的旧版弹窗（逐步迁移至动态modal） ====== -->
<div id="kgOverlay" class="workspace-modal-overlay" style="display:none">
  <div id="kgModal" class="workspace-modal kg-modal">
    <div class="workspace-modal-head">
      <h2 id="kgModalTitle">🕸️ 知识图谱</h2>
      <div class="workspace-modal-actions">
        <button onclick="typeof exportReport==='function'&&exportReport()" class="workspace-modal-btn primary">📄 导出报告</button>
        <button onclick="typeof exportKGAsPNG==='function'&&exportKGAsPNG()" class="workspace-modal-btn">🖼️ 导出PNG</button>
        <button onclick="typeof closeKnowledgeGraph==='function'&&closeKnowledgeGraph()" class="workspace-modal-btn">关闭</button>
      </div>
    </div>
    <div id="kgContent" class="workspace-modal-content kg-content-surface"></div>
  </div>
</div>

<!-- 上传覆盖层（兼容旧app.js流程） -->
<div class="upload-overlay" id="uploadOverlay" style="display:none">
  <div class="upload-card"><div class="upload-icon">📄</div>
    <h2>上传论文</h2><p>支持 <b>.docx</b>（推荐）与 <b>.doc</b></p>
    <div class="upload-drop" id="uploadDrop" onclick="document.getElementById('fileInput').click()">拖拽文件到此处或点击选择</div>
    <button onclick="document.getElementById('fileInput').click()" style="margin-top:12px;padding:8px 20px;border:1px solid var(--border);border-radius:10px;background:var(--bg-surface);color:var(--text-muted);cursor:pointer">选择文件</button>
    <button onclick="document.getElementById('uploadOverlay').classList.remove('show');document.getElementById('uploadOverlay').style.display='none'" style="margin-top:8px;padding:8px 20px;border:none;background:transparent;color:var(--text-muted);cursor:pointer">取消</button>
  </div>
</div>
<input type="file" id="fileInput" accept=".doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" style="display:none">
<script>window._pendingFile=null;window._importIntent='new';window.openImportDialog=function(intent){window._importIntent=intent||'new';var el=document.getElementById('uploadOverlay');if(el){el.style.display='flex';el.classList.add('show');}};window.triggerUpload=function(){window.openImportDialog('new');};window.showUploadOverlay=function(){var el=document.getElementById('uploadOverlay');if(el){el.style.display='flex';el.classList.add('show');}};
if(window.location.protocol==='file:'){document.getElementById('appShell').innerHTML='<div style="text-align:center;padding:100px 20px"><b>请通过 HTTP 访问</b><br><button onclick="window.open(\'http://localhost:5000/\',\'_self\')" style="font-size:1rem;padding:10px 30px;background:#0071e3;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700;margin-top:16px">一键跳转 HTTP</button></div>';}</script>

<script>
window.addEventListener('DOMContentLoaded',function(){
  if(typeof LoginModule!=='undefined')LoginModule.init();
  if(typeof AccountModule!=='undefined')AccountModule.init();
  if(typeof NotifyModule!=='undefined')NotifyModule.init();
  if(typeof PaperImport!=='undefined')PaperImport.init();
  if(typeof Nav!=='undefined')Nav.init();
  // 旧代码兼容：初始化后的回调
  if(typeof window.renderWorkspaceHero==='function'){try{window.renderWorkspaceHero()}catch(e){}}
  // 拖放上传
  var drop=document.getElementById('uploadDrop');
  if(drop){['dragenter','dragover'].forEach(function(e){drop.addEventListener(e,function(ev){ev.preventDefault();drop.classList.add('dragover')})});['dragleave','drop'].forEach(function(e){drop.addEventListener(e,function(ev){ev.preventDefault();drop.classList.remove('dragover');if(ev.dataTransfer&&ev.dataTransfer.files&&ev.dataTransfer.files.length&&typeof beginImportFile==='function')beginImportFile(ev.dataTransfer.files[0],window._importIntent||'new').catch(function(){})})})}
  // 文件输入
  var fi=document.getElementById('fileInput');
  if(fi)fi.addEventListener('change',function(){var file=fi.files[0];if(file&&typeof beginImportFile==='function')beginImportFile(file,window._importIntent||'new').catch(function(){console.error('[import]',arguments)})});
  // 自动检查登录
  var token=sessionStorage.getItem('thesis_ai_token');
  if(token){fetch('/api/auth/me',{headers:{'Authorization':'Bearer '+token}}).then(function(r){return r.json()}).then(function(d){if(d.success){document.getElementById('loginOverlay').style.display='none';document.getElementById('appShell').style.display='';if(window.TB&&TB.state)TB.state.setUser(d.user);if(window.TB&&TB.api)TB.api.startBalancePolling(30000);if(window.ThesisProject&&ThesisProject.bootstrapAuthenticatedUser)ThesisProject.bootstrapAuthenticatedUser().catch(function(e){console.warn('[bootstrap]',e)})}})};
  window.dispatchEvent(new Event('resize'));
});
</script>
